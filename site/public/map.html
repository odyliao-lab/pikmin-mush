function remainMs(m){return m.finish_ms?+m.finish_ms-Date.now():Number.MAX_SAFE_INTEGER}function remain(m){if(!m.finish_ms)return'無期限';const s=Math.round((+m.finish_ms-Date.now())/1000);if(s<=0)return'已過期';const h=Math.floor(s/3600),n=Math.floor(s%3600/60);return h?`剩 ${h} 小時 ${n} 分`:`剩 ${n} 分`}
function discoveredAt(m){return +m.discovered_at||Math.max(+m.first_seen||0,Math.floor((+m.start_ms||0)/1000))}
function discoveredBy(m){return m.discovered_by?` (${esc(m.discovered_by)})`:'（來源未記錄）'}
function formatDateTime(ms){if(!ms)return'尚無資料';const d=new Date(+ms),pad=n=>String(n).padStart(2,'0');return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`}
function copyText(v,success){if(navigator.clipboard?.writeText)navigator.clipboard.writeText(v).then(()=>alert(success)).catch(()=>prompt('請手動複製',v));else prompt('請手動複製',v)}
function auditCopy(kind,id,lat,lng,level,type){const payload=JSON.stringify({kind,id,lat,lng,level,type});try{if(navigator.sendBeacon?.('/api/audit/copy',new Blob([payload],{type:'application/json'})))return}catch(_){}fetch('/api/audit/copy',{method:'POST',headers:{'Content-Type':'application/json'},body:payload,keepalive:true}).catch(()=>{})}
function auditEvent(event_type,dimension='',mushroom_id=''){const payload=JSON.stringify({event_type,dimension,mushroom_id});try{if(navigator.sendBeacon?.('/api/audit/event',new Blob([payload],{type:'application/json'})))return}catch(_){}fetch('/api/audit/event',{method:'POST',headers:{'Content-Type':'application/json'},body:payload,keepalive:true}).catch(()=>{})}
function auditError(error){const match=String(error?.message||error||'').match(/http\s+(\d{3})/i);auditEvent('api_error',match?`/api/mushrooms:http-${match[1]}`:'/api/mushrooms:network')}
function copyGps(id,lat,lng,level,type){copyText(`${(+lat).toFixed(7)},${(+lng).toFixed(7)}`,'GPS 已複製');auditCopy('gps',id,lat,lng,level,type)}
function copyMushInfo(id,level,type,lat,lng){const sizeName={2:'一般',3:'大',4:'巨'}[+level]||`Lv.${level}`,kind=typeName(type);copyText(`${sizeName}${kind} ${(+lat).toFixed(6)},${(+lng).toFixed(6)}`,'蘑菇資訊已複製');auditCopy('info',id,lat,lng,level,type)}
function agentColor(agent){const palette=['#4ea8d4','#9a6dd7','#ed8b5d','#5eab72','#d76e99'];const total=[...String(agent.id)].reduce((n,char)=>n+char.charCodeAt(0),0);return palette[total%palette.length]}
const AGENT_STATE_LABELS={assigned:'已派工',waiting:'等待下一點',delayed:'回報稍慢',paused:'已暫停',offline:'未近期回報'};
function agentPopup(agent){const [lat,lng]=agent.current_location||[];const place=[agent.country,agent.city].filter(Boolean).join('-')||'掃描點';const source=agent.location_source==='recent_target'?'最近派工位置':'本次派工位置';return `<b>🤖 ${esc(agent.name)}</b><br>${esc(AGENT_STATE_LABELS[agent.state]||'已派工')}・${esc(place)}<br>${source}：${(+lat).toFixed(6)}, ${(+lng).toFixed(6)}<br>最後回報：${formatDateTime(+agent.last_seen)}`}
function renderAgentRoster(){const list=document.getElementById('fleet-items');document.getElementById('fleet-summary').textContent=GpsGate.state.authorized?`掃描機隊 ${mapRoster.length} 台・地圖 ${Object.keys(agentMarkers).length} 台`:'解鎖 GPS 後查看掃描機隊';list.innerHTML=mapRoster.map(a=>`<button type="button" data-agent-focus="${esc(a.id)}" ${agentMarkers[a.id]?'':'disabled'}>${esc(a.name)}<small>${esc(AGENT_STATE_LABELS[a.state]||'已派工')}${a.city?'・'+esc(a.city):'・尚無近期派工位置'}</small></button>`).join('');document.getElementById('fleet-all').hidden=Object.keys(agentMarkers).length===0}

function agentIcon(agent){return L.divIcon({className:'',iconSize:[38,38],iconAnchor:[19,38],popupAnchor:[0,-34],html:`<div class="agent-marker" style="--agent-color:${agentColor(agent)}"><span>🌱</span></div>`})}
function renderLiveAgents(){const live=new Set();for(const agent of liveAgents){const point=agent.current_location||[],lat=Number(point[0]),lng=Number(point[1]);if(!Number.isFinite(lat)||!Number.isFinite(lng))continue;live.add(agent.id);if(!agentMarkers[agent.id])agentMarkers[agent.id]=L.marker([lat,lng],{icon:agentIcon(agent),title:agent.name,keyboard:true,zIndexOffset:900}).addTo(map).bindPopup(agentPopup(agent)).bindTooltip(esc(agent.name),{className:'agent-tooltip',direction:'top',offset:[0,-34]});else{agentMarkers[agent.id].setLatLng([lat,lng]);agentMarkers[agent.id].setIcon(agentIcon(agent));agentMarkers[agent.id].setPopupContent(agentPopup(agent));agentMarkers[agent.id].setTooltipContent(esc(agent.name))}}for(const id in agentMarkers)if(!live.has(id)){map.removeLayer(agentMarkers[id]);delete agentMarkers[id]}renderAgentRoster()}
function popup(m){const start=formatDateTime(m.start_ms),finish=m.finish_ms?formatDateTime(m.finish_ms):'無期限',updated=formatDateTime((+m.last_seen||0)*1000),found=formatDateTime(discoveredAt(m)*1000),capacity=+m.challenger_capacity||'?';return `<b>🍄 Lv.${m.level}・${esc(typeName(m.type))}</b><br>🏙️ ${esc(cityName(m))}<hr>POI：<code>${esc(m.id)}</code><br>${GpsGate.state.owner?'GPS：'+(+m.lat).toFixed(7)+', '+(+m.lng).toFixed(7)+'<br>':''}類型：${esc(typeName(m.type))}（${m.type}）<br>發現時間：${found}${discoveredBy(m)}<br>更新時間：${updated}<hr><b>⚔️ 挑戰資訊</b><br>參加人數：${MushroomFreshness.validCount(m)?`${+m.challenger_count} / ${capacity}`:'未知'}<br>資料新鮮度：${esc(MushroomFreshness.label(m))}<br><small>更新時間是伺服器接收時間；不保證目前仍有名額。</small><br>參加者總戰力：${(+m.total_power||0).toLocaleString()}<br>挑戰開始：${start}<br>挑戰結束：${finish}<br>${remain(m)}<br><button data-action="copy-gps" data-id="${esc(m.id)}" data-level="${+m.level}" data-type="${+m.type}">複製 GPS</button> <button data-action="copy-info" data-id="${esc(m.id)}" data-level="${+m.level}" data-type="${+m.type}">複製資訊</button>　<a target="_blank" rel="noopener noreferrer" href="https://maps.google.com/?q=${+m.lat},${+m.lng}">Google 地圖</a>`}
function filterState(){return{levels:[2,3,4].filter(l=>document.getElementById('lv'+l).checked),q:document.getElementById('search').value.trim().toLowerCase(),underFiveOnly:document.getElementById('under-five-only').checked,recentHours:Number(document.getElementById('recent-hours').value)||0}}
function filterDimension(){const s=filterState(),types=[...selectedTypes].sort().join(',')||'none';return `lv:${s.levels.join(',')||'none'}|type:${types}|u5:${s.underFiveOnly?1:0}|time:${s.recentHours||'all'}|q:${s.q?'yes':'no'}`}
function matchesClientFilters(rows){const {levels,q,underFiveOnly,recentHours}=filterState(),discoveredAfter=recentHours?Math.floor(Date.now()/1000)-recentHours*60*60:0;const levelSet=new Set(levels);return rows.filter(m=>+m.level>=2&&levels.length&&levelSet.has(+m.level)&&selectedTypes.has(typeKey(m.type))&&(!recentHours||discoveredAt(m)>=discoveredAfter)&&(!underFiveOnly||isUnderFive(m))&&(!q||m.id.toLowerCase().includes(q)||cityName(m).includes(q)||`${m.lat},${m.lng}`.includes(q)))}
function sortRows(rows){const sort=document.getElementById('sort').value,prioritizeLow=document.getElementById('prioritize-low').checked;return [...rows].sort((a,b)=>{if(prioritizeLow&&isLowParticipants(a)!==isLowParticipants(b))return isLowParticipants(a)?-1:1;if(sort==='level')return b.level-a.level;if(sort==='remain-desc')return remainMs(b)-remainMs(a);if(sort==='discovered')return discoveredAt(a)-discoveredAt(b);if(sort==='discovered-desc')return discoveredAt(b)-discoveredAt(a);return remainMs(a)-remainMs(b)})}
function render(){const mapData=GpsGate.state.authorized?sortRows(matchesClientFilters(all)).filter(m=>m.lat!==null&&m.lng!==null&&Number.isFinite(+m.lat)&&Number.isFinite(+m.lng)):[],data=listRows,isGlobalSearch=Boolean(filterState().q);const live=new Set(mapData.map(m=>m.id));for(const id in markers)if(!live.has(id)){map.removeLayer(markers[id]);delete markers[id]}for(const m of mapData){if(!markers[m.id])markers[m.id]=L.marker([m.lat,m.lng],{icon:mushIconFor(m)}).addTo(map).on('popupopen',()=>auditEvent('map_focus','',m.id));markers[m.id].setIcon(mushIconFor(m));markers[m.id].bindPopup(popup(m))}renderLiveAgents();const total=listTotal;document.getElementById('count').textContent=total;const more=viewportTruncated?'・地圖資料較多，請放大地圖':'';document.getElementById('summary').innerHTML=`${isGlobalSearch?'全世界搜尋結果':'清單符合'} <strong>${total}</strong> 個${more}`;const note=`<div class="list-note">${isGlobalSearch?'全球搜尋已載入 '+data.length+' / '+listTotal+' 筆':'清單已載入 '+data.length+' / '+listTotal+' 筆'}</div>`;const items=data.length?data.map(m=>`<article class="item${isLowParticipants(m)?' item-low-participants':''}" style="border-left-color:${levelColor(+m.level)}" data-focus-id="${esc(m.id)}" role="button" tabindex="0"><div class="item-head"><div class="item-title">🍄 ${esc(levelName(m.level))}・${esc(typeName(m.type))}</div><div class="item-actions"><button class="copy-btn" data-action="copy-gps" data-id="${esc(m.id)}" data-level="${+m.level}" data-type="${+m.type}">複製 GPS</button><button class="copy-btn" data-action="copy-info" data-id="${esc(m.id)}" data-level="${+m.level}" data-type="${+m.type}">複製資訊</button></div></div><div class="item-meta">👥 ${esc(MushroomFreshness.label(m))}<br>🕐 發現 ${formatDateTime(discoveredAt(m)*1000)}${discoveredBy(m)}・⏳ ${remain(m)}<br>📍 ${esc(cityName(m))}${GpsGate.state.owner?'・'+(+m.lat).toFixed(6)+', '+(+m.lng).toFixed(6):'・GPS 已隱藏'}</div></article>`).join(''):'<div class="empty">🌱 沒有符合目前篩選條件的蘑菇</div>';const moreButton=listHasMore?'<button type="button" class="load-more" data-action="load-more">載入更多（已載入 '+data.length+' / '+listTotal+'）</button>':'';document.getElementById('mush-list').innerHTML=note+items+moreButton}
// This static map script is syntax-checked before each production publish.
async function focusM(id){let exact;try{exact=await GpsGate.coordinates(id)}catch(e){alert(e.message);return}if(!exact)return;const m=exact||all.find(x=>x.id===id)||listRows.find(x=>x.id===id);if(m){map.setView([m.lat,m.lng],Math.max(map.getZoom(),15));markers[id]?.openPopup();if(innerWidth<761)scrollTo({top:0,behavior:'smooth'})}}
function updateTypes(){const vals=visibleTypeKeys();if(!typesInitialized){vals.forEach(v=>{if(!DEFAULT_HIDDEN_TYPE_KEYS.has(v))selectedTypes.add(v)});typesInitialized=true};document.getElementById('type-checks').innerHTML=vals.map(v=>`<label class="chip"><input type="checkbox" data-filter-type="${v}" ${selectedTypes.has(v)?'checked':''}> ${esc(typeName(v))}</label>`).join('');document.querySelectorAll('[data-filter-type]').forEach(el=>el.addEventListener('change',()=>{el.checked?selectedTypes.add(el.dataset.filterType):selectedTypes.delete(el.dataset.filterType);refreshBoth()}))}
function viewportBbox(){const b=map.getBounds();return MushroomQueries.quantizedBbox([b.getWest(),b.getSouth(),b.getEast(),b.getNorth()])}
function queryParams(limit){return MushroomQueries.filterParams(filterState(),selectedTypes,document.getElementById('sort').value,document.getElementById('prioritize-low').checked,limit)}
async function refresh(automatic=false){
 if(!await GpsGate.check()){all=[];liveAgents=[];mapRoster=[];render();return;}
 if(automatic&&activeRequest)return;
 if(activeRequest)activeRequest.abort();activeRequest=new AbortController();const request=activeRequest,signal=request.signal;
 try{
  if(!filterState().levels.length||!selectedTypes.size){all=[];viewportTotal=0;viewportTruncated=false;render();return}
  const base=queryParams(VIEW_PAGE_SIZE);base.set('bbox',viewportBbox());
  let cursor='',rows=[],first=null,hasMore=true;
  while(hasMore&&rows.length<MAX_VIEW_ROWS){
   const params=new URLSearchParams(base);if(cursor){params.set('cursor',cursor);params.set('include_meta','0')}
   const d=await readMapPage(params,signal);if(signal.aborted)return;
   if(!first)first=d;rows.push(...(d.mushrooms||[]));cursor=d.pagination?.next_cursor||'';hasMore=Boolean(d.pagination?.has_more&&cursor);
  }
  const d=first||{};all=rows.filter(m=>+m.level>=2);liveAgents=Array.isArray(d.live_agents)?d.live_agents:[];mapRoster=Array.isArray(d.map_agents)?d.map_agents:liveAgents;
  viewportTotal=Number(d.count??all.length);viewportTruncated=hasMore||all.length<viewportTotal;
  document.getElementById('upd').textContent='地圖更新：'+new Date((d.updated||0)*1000).toLocaleTimeString();
  const s=d.status||{},place=s.city?(s.country?`${s.country}-${s.city}`:s.city):'';
  document.getElementById('scan').innerHTML=(s.running?`掃描中 ${esc(s.point||0)}/${esc(s.total||0)}`:'目前未掃描')+(place?`<br>🏙️ 目前掃描：${esc(place)} ${esc(s.city_index||1)}/${esc(s.city_total||1)}`:'')+`<br>本點 +${esc(s.new_at_point||0)}・累計 ${esc(s.captured_total||0)}`;
  render();
 }catch(e){if(e.name!=='AbortError'){document.getElementById('upd').textContent=e.name==='RetryLaterError'?e.message:'暫時無法取得地圖資料';if(e.name!=='RetryLaterError')auditError(e)}}
 finally{if(activeRequest===request)activeRequest=null}
}
async function refreshList(reset=true,automatic=false){
 if(automatic&&!MushroomQueries.shouldRefreshList({hidden:document.hidden,busy:Boolean(listRequest),rows:listRows.length,pageSize:LIST_PAGE_SIZE,lastUpdated:listUpdated,now:Date.now()}))return;
 if(!reset&&(!listHasMore||listRequest))return;
 if(listRequest)listRequest.abort();listRequest=new AbortController();const request=listRequest,signal=request.signal;
 try{
  if(!filterState().levels.length||!selectedTypes.size){listRows=[];listTotal=0;listHasMore=false;listCursor='';render();return}
  const params=queryParams(LIST_PAGE_SIZE); // Global list intentionally has no bbox.
  if(!reset&&listCursor){params.set('cursor',listCursor);params.set('include_meta','0')}
  const d=await readMapPage(params,signal);if(signal.aborted)return;
  const rows=reset?d.mushrooms||[]:[...listRows,...(d.mushrooms||[])],seen=new Set();
  listRows=rows.filter(m=>!seen.has(m.id)&&seen.add(m.id));
  if(reset){listTotal=Number(d.count??listRows.length);listUpdated=Date.now();listSnapshotAt=Number(d.updated||Math.floor(listUpdated/1000))*1000}
  listCursor=d.pagination?.next_cursor||'';listHasMore=Boolean(d.pagination?.has_more&&listCursor);
  document.getElementById('list-upd').textContent='清單截至 '+new Date(listSnapshotAt).toLocaleTimeString()+(listRows.length>LIST_PAGE_SIZE?'・多頁瀏覽中，按「立即刷新」查看最新第一頁':'・每分鐘更新');render();
 }catch(e){
  if(e.name==='CursorExpiredError'&&!reset){listRequest=null;document.getElementById('list-upd').textContent='分頁已過期，重新載入最新清單';return refreshList(true)}
  if(e.name!=='AbortError'){document.getElementById('list-upd').textContent=e.name==='RetryLaterError'?e.message:'清單更新失敗，保留上次資料';if(e.name!=='RetryLaterError')auditError(e)}
 }finally{if(listRequest===request)listRequest=null}
}
function refreshBoth(){refresh();refreshList(true)}
GpsGate.onLock(()=>{activeRequest?.abort();listRequest?.abort();all=[];liveAgents=[];mapRoster=[];listRows=listRows.map(m=>({...m,lat:null,lng:null}));listCursor='';listHasMore=false;render();});document.getElementById('gps-unlock').addEventListener('click',async()=>{if(await GpsGate.unlock())refreshBoth();});
document.getElementById('fleet-all').addEventListener('click',()=>{const points=liveAgents.map(a=>a.current_location).filter(p=>Array.isArray(p)&&p.length===2&&p.every(Number.isFinite));if(points.length)map.fitBounds(L.latLngBounds(points),{padding:[45,45],maxZoom:8})});
document.getElementById('fleet-items').addEventListener('click',event=>{const button=event.target.closest('[data-agent-focus]');if(!button)return;const marker=agentMarkers[button.dataset.agentFocus];if(marker){map.setView(marker.getLatLng(),Math.max(map.getZoom(),9));marker.openPopup()}});
document.addEventListener('click',async event=>{const action=event.target.closest('[data-action]');if(action){event.stopPropagation();if(action.dataset.action==='load-more'){refreshList(false);return}const id=String(action.dataset.id||''),level=Number(action.dataset.level),type=Number(action.dataset.type);if(!id||![2,3,4].includes(level)||!Number.isInteger(type))return;try{const m=await GpsGate.coordinates(id);if(!m)return;if(action.dataset.action==='copy-gps')copyGps(id,m.lat,m.lng,level,type);if(action.dataset.action==='copy-info')copyMushInfo(id,level,type,m.lat,m.lng);}catch(e){alert(e.message)}return}const item=event.target.closest('[data-focus-id]');if(item)focusM(item.dataset.focusId)});
document.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.matches('[data-focus-id]')){event.preventDefault();focusM(event.target.dataset.focusId)}});
function setAutoRefresh(){clearInterval(refreshTimer);if(document.getElementById('auto-refresh').checked)refreshTimer=setInterval(()=>{if(!document.hidden){refresh(true);refreshList(true,true)}},20000)}
['lv2','lv3','lv4','under-five-only','recent-hours'].forEach(id=>document.getElementById(id).addEventListener('input',()=>{auditEvent('filter_apply',filterDimension());refreshBoth()}));['sort','prioritize-low'].forEach(id=>document.getElementById(id).addEventListener('input',refreshBoth));document.getElementById('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{auditEvent(document.getElementById('search').value.trim()?'search':'filter_apply',filterDimension());refreshBoth()},300)});document.getElementById('auto-refresh').addEventListener('change',setAutoRefresh);document.getElementById('refresh-now').addEventListener('click',refreshBoth);document.getElementById('types-all').addEventListener('click',()=>{document.querySelectorAll('[data-filter-type]').forEach(x=>{x.checked=true;selectedTypes.add(x.dataset.filterType)});auditEvent('filter_apply',filterDimension());refreshBoth()});document.getElementById('types-none').addEventListener('click',()=>{selectedTypes.clear();document.querySelectorAll('[data-filter-type]').forEach(x=>x.checked=false);auditEvent('filter_apply',filterDimension());refreshBoth()});map.on('moveend',()=>{clearTimeout(moveTimer);moveTimer=setTimeout(()=>refresh(),250)});updateTypes();refreshBoth();auditEvent('page_view','map');setAutoRefresh();setInterval(()=>!document.hidden&&all.length&&render(),30000);
</script></body></html>
