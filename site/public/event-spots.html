<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://unpkg.com 'sha256-6gpddhje8uQ2roK6VOEXBUps7lXqN71DhYAJmM4PDPo='; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pikmin 活動金盆地圖</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<style>
:root{--leaf:#397548;--leaf2:#65a85c;--cream:#fff9e9;--paper:#fffdf6;--ink:#304035;--muted:#68766b;--line:#d9e1cf;--gold:#efb62f;--orange:#e57d35}*{box-sizing:border-box}html,body,#app{margin:0;min-height:100%;font-family:"Microsoft JhengHei",system-ui,sans-serif;color:var(--ink)}body{background:var(--cream)}#app{display:flex;height:100dvh;overflow:hidden}.sidebar{width:400px;flex:0 0 400px;background:var(--cream);display:flex;flex-direction:column;box-shadow:3px 0 16px #30403025;z-index:1001}.brand{padding:14px 16px;background:linear-gradient(125deg,var(--leaf),var(--leaf2));color:#fff}.brand h1{font-size:20px;margin:0;font-weight:800}.brand p{margin:3px 0 0;font-size:13px}.tabs{display:flex;gap:8px;margin-top:10px}.tabs a{color:#fff;text-decoration:none;border:1px solid #ffffff75;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800}.tabs a.active{background:#fff;color:var(--leaf)}.filters{background:var(--paper);padding:10px 12px;border-bottom:1px solid var(--line)}.filter-row{display:flex;gap:8px;align-items:center;margin:6px 0}.filter-row label{font-size:13px;font-weight:800;min-width:44px}.field{flex:1;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff;color:var(--ink)}.check{font-size:13px;accent-color:var(--leaf)}#spot-list{overflow:auto;flex:1;padding:7px 8px 24px}.item{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:10px;margin:5px 0;padding:8px;cursor:pointer}.item.ended{opacity:.58;border-left-color:#99a49a}.item h2{font-size:15px;margin:0}.item p{font-size:12px;color:var(--muted);margin:3px 0;line-height:1.45}.badge{display:inline-block;border-radius:999px;padding:2px 6px;font-size:11px;font-weight:800;background:#fff3c5;color:#755000}.badge.limited{background:#ffe4d1;color:#9c4918}.actions{display:flex;gap:6px;margin-top:6px}.button{border:0;border-radius:999px;background:#e7f4df;color:var(--leaf);font-weight:800;padding:5px 8px;font-size:12px;cursor:pointer}.map-shell{position:relative;flex:1;min-width:0;height:100dvh}#map{height:100%;width:100%}.panel{position:absolute;z-index:1000;background:#284432e8;color:#fff;border:1px solid #ffffff30;box-shadow:0 4px 14px #0003;border-radius:14px;padding:8px 11px;font-size:12px;line-height:1.55}#hud{left:12px;top:12px}.spot-marker{width:37px;height:37px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff7a6 0 15%,var(--gold) 42%,var(--orange) 100%);border:3px solid #fff;border-radius:50%;font-size:22px;filter:drop-shadow(0 3px 3px #0007)}.leaflet-popup-content{line-height:1.55}.leaflet-popup-content button{border:0;border-radius:8px;background:var(--leaf);color:#fff;padding:5px 8px}@media(max-width:760px){#app{flex-direction:column;height:auto;min-height:100dvh;overflow:visible}.map-shell{order:1;height:48dvh;min-height:330px;flex:none}.sidebar{order:2;width:100%;flex:none;min-height:52dvh;box-shadow:0 -4px 16px #30403025}#spot-list{overflow:visible}.leaflet-control-zoom{display:none}}
</style></head><body><main id="app"><aside class="sidebar"><header class="brand"><h1>🌱 Pikmin 活動金盆</h1><p id="summary">正在整理活動資源點…</p><nav class="tabs" aria-label="地圖頁籤"><a href="/map.html">蘑菇雷達</a><a class="active" href="/event-spots.html">活動金盆</a></nav></header><section class="filters"><div class="filter-row"><label for="country">地區</label><select class="field" id="country"><option value="">全部</option></select></div><div class="filter-row"><label class="check"><input id="active" type="checkbox" checked> 只顯示有效／常設點</label></div><div class="filter-row"><label for="search">搜尋</label><input class="field" id="search" placeholder="名稱、城市、獎勵"></div></section><section id="spot-list" aria-live="polite"></section></aside><section class="map-shell"><div id="map"></div><div id="hud" class="panel">活動金盆 <b id="count">0</b> 個<br><span id="updated">等待資料…</span></div></section></main><script>
const map=L.map('map').setView([35.68,139.76],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let all=[],markers={};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const zone=s=>s?.country==='美國'?(s.city==='紐約'?'America/New_York':s.city?.includes('Nashville')?'America/Chicago':'America/Los_Angeles'):s?.country==='日本'?'Asia/Tokyo':s?.country==='韓國'?'Asia/Seoul':s?.country==='新加坡'?'Asia/Singapore':s?.country==='法國'?'Europe/Paris':s?.country==='荷蘭'?'Europe/Amsterdam':'Asia/Taipei';const fmt=(t,s)=>t?new Date(+t*1000).toLocaleDateString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:zone(s)}):'日期未提供';const period=s=>s.period_note||(s.spot_kind==='permanent'?'常設':`${fmt(s.start_at,s)} ～ ${fmt(s.end_at,s)}（${zone(s)}）`);const isActive=s=>!s.end_at||+s.end_at*1000>=Date.now();const copy=(s,msg)=>navigator.clipboard?.writeText(s).then(()=>alert(msg)).catch(()=>prompt('請手動複製',s))||prompt('請手動複製',s);const located=s=>Number.isFinite(s.lat)&&Number.isFinite(s.lng);const gps=s=>located(s)?`${s.lat.toFixed(6)},${s.lng.toFixed(6)}`:'座標待確認';const source=s=>s.source_url?`<a target="_blank" rel="noopener noreferrer" href="${esc(s.source_url)}">${esc(s.source_title)}</a>`:esc(s.source_title);function popup(s){return `<b>🌱 ${esc(s.name)}</b><br>${esc(s.country)}－${esc(s.city)}<hr>GPS：${gps(s)}<br>獎勵：${esc(s.reward_summary)}<br>類型：${s.spot_kind==='permanent'?'常設':'限時活動'}<br>期間：${period(s)}<br>限制：${esc(s.cooldown_note)}<br>資格：${esc(s.eligibility_note)}<br><small>座標說明：${esc(s.coordinate_note)}<br>來源等級：${s.verification_status==='official'?'官方公告':'社群／使用者提供'}<br>資料：${source(s)}<br>最後驗證：${fmt(s.last_verified_at)}</small><br><button data-copy="${gps(s)}">複製 GPS</button>`}function filtered(){const q=document.getElementById('search').value.trim().toLowerCase(),c=document.getElementById('country').value,active=document.getElementById('active').checked;return all.filter(s=>(!c||s.country===c)&&(!active||isActive(s))&&(!q||[s.name,s.city,s.country,s.reward_summary].join(' ').toLowerCase().includes(q)))}function render(){const data=filtered(),points=data.filter(located),live=new Set(points.map(s=>s.id));for(const id in markers)if(!live.has(id)){map.removeLayer(markers[id]);delete markers[id]}for(const s of points){if(!markers[s.id])markers[s.id]=L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',iconSize:[37,37],iconAnchor:[18,18],html:'<div class="spot-marker">🌱</div>'})}).addTo(map);markers[s.id].bindPopup(popup(s))}document.getElementById('count').textContent=points.length;document.getElementById('summary').textContent=`顯示 ${points.length} 個座標點${data.length>points.length?`／${data.length-points.length} 項待座標活動`:''}（來源請見詳情）`;document.getElementById('spot-list').innerHTML=data.length?data.map(s=>`<article class="item ${isActive(s)?'':'ended'}" data-id="${esc(s.id)}" tabindex="0"><h2>${esc(s.name)}</h2><p><span class="badge ${s.spot_kind==='limited'?'limited':''}">${!located(s)?'座標待確認':s.spot_kind==='permanent'?'常設':'限時'}</span>　${esc(s.country)}－${esc(s.city)}</p><p>🌱 ${esc(s.reward_summary)}<br>🗓️ ${esc(period(s))}<br>📍 ${gps(s)}</p>${!located(s)?`<details><summary>活動詳情與官方來源</summary><p>${esc(s.eligibility_note)}<br>領取：${esc(s.cooldown_note)}<br>${esc(s.coordinate_note)}<br>${source(s)}</p></details>`:''}<div class="actions">${located(s)?`<button class="button" data-copy="${gps(s)}">複製 GPS</button><button class="button" data-open="${esc(s.id)}">地圖定位</button>`:'<span class="badge">精確GPS待確認・不在地圖標記</span>'}</div></article>`).join(''):'<p style="padding:24px;text-align:center;color:#68766b">沒有符合條件的金盆點或活動</p>'}async function load(){const r=await fetch('/api/event-spots?status=all');if(!r.ok)throw new Error('http '+r.status);const d=await r.json();const extra=await fetch('/event-spot-notices.json').then(r=>r.ok?r.json():[]).catch(()=>[]);all=[...(d.spots||[]),...(Array.isArray(extra)?extra:[])];const countries=[...new Set(all.map(s=>s.country))].sort();document.getElementById('country').innerHTML='<option value="">全部</option>'+countries.map(c=>`<option>${esc(c)}</option>`).join('');document.getElementById('updated').textContent='更新：'+new Date((d.updated||0)*1000).toLocaleTimeString('zh-TW');render()}document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(b){e.stopPropagation();copy(b.dataset.copy,'GPS 已複製');return}const o=e.target.closest('[data-open]'),item=e.target.closest('[data-id]');const id=o?.dataset.open||item?.dataset.id;if(id){const s=all.find(x=>x.id===id);if(s&&located(s)){map.setView([s.lat,s.lng],16);markers[id].openPopup();if(innerWidth<761)scrollTo({top:0,behavior:'smooth'})}}});['country','active','search'].forEach(id=>document.getElementById(id).addEventListener('input',render));load().catch(()=>document.getElementById('summary').textContent='暫時無法載入活動金盆資料');
</script></body></html>
