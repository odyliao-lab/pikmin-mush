name: Security CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node scripts/audit-lockfile.mjs
      - name: Validate Android Agent shell
        working-directory: .
        run: |
          bash -n phone_agent/agent.sh
          bash -n phone_agent/power-guard.sh
          bash -n phone_agent/control.sh
          bash -n phone_agent/allow-control-app-root.sh
          bash phone_agent/tests/control-test.sh
          bash phone_agent/tests/power-guard-test.sh
          bash phone_agent/tests/power-guard-integration-test.sh
          bash phone_agent/tests/upload-chunk-test.sh
