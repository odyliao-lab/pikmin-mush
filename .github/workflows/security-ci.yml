name: Security CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node --test ../maintenance-worker/index.test.mjs
      - run: node scripts/audit-lockfile.mjs
      - name: Validate Android Agent shell
        working-directory: .
        run: |
          bash -n phone_agent/agent.sh
          python3 phone_agent/tests/emulator-access-test.py
          bash -n phone_agent/power-guard.sh
          bash -n phone_agent/control.sh
          bash -n phone_agent/allow-control-app-root.sh
          bash -n phone_agent/popup-recovery.sh
          bash phone_agent/tests/control-test.sh
          bash phone_agent/tests/power-guard-test.sh
          bash phone_agent/tests/power-guard-integration-test.sh
          bash phone_agent/tests/upload-chunk-test.sh
          bash phone_agent/tests/auth-stdin-test.sh
          bash phone_agent/tests/shell-context-test.sh
          bash phone_agent/tests/map-entry-test.sh
          bash phone_agent/tests/visual-recovery-test.sh
          bash phone_agent/tests/popup-recovery-test.sh
          bash phone_agent/tests/popup-network-test.sh
          bash phone_agent/tests/popup-announcement-test.sh
          bash phone_agent/tests/daily-recap-test.sh
          bash phone_agent/tests/scan-recovery-test.sh
          bash phone_agent/tests/scan-accounting-test.sh
          bash phone_agent/tests/scan-ack-upload-boundary-test.sh
          bash phone_agent/tests/teleport-file-test.sh
          bash phone_agent/tests/gps-provider-test.sh
          bash phone_agent/tests/gps-live-recovery-test.sh
          bash -n phone_agent/service.sh
          bash phone_agent/tests/service-boot-delay-test.sh
          bash phone_agent/tests/mumu-code-cache-test.sh
          bash phone_agent/tests/cold-restart-test.sh
          bash -n phone_agent/runtime-version.sh
          bash phone_agent/tests/runtime-version-test.sh
          c++ -std=c++17 -Wall -Wextra -Werror module/tests/scanner-performance-test.cpp -o /tmp/scanner-performance-test
          /tmp/scanner-performance-test
          c++ -std=c++17 -Wall -Wextra -Werror module/tests/nativebridge-startup-test.cpp -o /tmp/nativebridge-startup-test
          /tmp/nativebridge-startup-test
          cc -O2 -Wall -Werror phone_agent/ui-probe.c -o /tmp/ui-probe
          python3 phone_agent/tests/ui-probe-test.py /tmp/ui-probe
          cc -O2 -Wall -Wextra -Werror phone_agent/popup-probe.c -o /tmp/popup-probe
          python3 phone_agent/tests/popup-probe-test.py /tmp/popup-probe
          python3 phone_agent/tests/popup-package-test.py
