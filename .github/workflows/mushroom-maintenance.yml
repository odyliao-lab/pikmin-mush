name: Mushroom maintenance

on:
  schedule:
    # Keep cleanup independent of map traffic and the user's Windows PC.
    - cron: '7,22,37,52 * * * *'
    # A separate hourly health check limits alert volume during outages.
    - cron: '11 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mushroom-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MAINTENANCE_TOKEN: ${{ secrets.MUSHROOM_MAINTENANCE_TOKEN }}
      DISCORD_WEBHOOK: ${{ secrets.MUSHROOM_MAINTENANCE_DISCORD_WEBHOOK }}
      SCHEDULE: ${{ github.event.schedule }}
    steps:
      - name: Run bounded maintenance and check fleet health
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$MAINTENANCE_TOKEN" ]]; then
            echo 'Maintenance secret is missing' >&2
            exit 1
          fi
          response="$(curl --fail-with-body --silent --show-error --max-time 90 \
            -X POST -H "Authorization: Bearer $MAINTENANCE_TOKEN" \
            -H 'Accept: application/json' \
            https://mush.odyliao.cc/api/controller/maintenance)"
          RESPONSE="$response" python3 - <<'PY'
          import json, os, sys, urllib.request
          data = json.loads(os.environ['RESPONSE'])
          retention = data['retention']
          alerts = data['alerts']
          print('retention', {key: retention[key] for key in
                 ('lastSucceededAt', 'lastDeleted', 'pending', 'lastBatchSaturated',
                  'consecutiveFailures', 'lastDurationMs')})
          if os.environ.get('SCHEDULE') != '11 * * * *':
              sys.exit(0)
          problems = []
          if alerts['maintenanceStale'] or alerts['maintenanceFailing']:
              problems.append('清理未正常完成')
          if alerts['retentionBacklog']:
              problems.append(f"清理積壓：待刪 {retention['pending']}、批次達上限 {retention['lastBatchSaturated']}")
          if alerts['uploadSilentAgents']:
              problems.append('兩小時無成功上傳：' + ', '.join(alerts['uploadSilentAgents']))
          if not problems:
              sys.exit(0)
          message = '【蘑菇系統維護警示】\n' + '\n'.join(problems)
          webhook = os.environ.get('DISCORD_WEBHOOK', '')
          if not webhook:
              print('Discord webhook secret is missing', file=sys.stderr)
              sys.exit(1)
          request = urllib.request.Request(webhook, data=json.dumps({'content': message}).encode(),
                                           headers={'Content-Type': 'application/json'}, method='POST')
          try:
              with urllib.request.urlopen(request, timeout=20) as reply:
                  if reply.status not in (200, 204):
                      raise RuntimeError('Discord alert was not accepted')
          except Exception:
              print('Discord alert was not accepted', file=sys.stderr)
              sys.exit(1)
          PY
