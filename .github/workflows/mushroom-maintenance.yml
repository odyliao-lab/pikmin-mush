name: Mushroom maintenance

on:
  schedule:
    # Separate fallback; primary is the independent Cloudflare scheduler.
    - cron: '7,22,37,52 * * * *'
    # Preserve the existing independent hourly fleet-health warning.
    - cron: '13 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mushroom-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MAINTENANCE_TOKEN: ${{ secrets.MUSHROOM_MAINTENANCE_TOKEN }}
      EVENT_NAME: ${{ github.event_name }}
      SCHEDULE: ${{ github.event.schedule }}
      DISCORD_WEBHOOK: ${{ secrets.MUSHROOM_MAINTENANCE_DISCORD_WEBHOOK }}
    steps:
      - name: Run bounded maintenance
        shell: bash
        run: |
          set -euo pipefail
          request_failed=0
          request_started_at="$(date +%s.%N)"
          result="$(curl --fail-with-body --silent --show-error --max-time 90 \
            --write-out '\n%{http_code}' \
            -X POST -H "Authorization: Bearer $MAINTENANCE_TOKEN" \
            -H "X-Maintenance-Event: $EVENT_NAME" \
            -H 'Accept: application/json' \
            https://mush.odyliao.cc/api/controller/maintenance)" || request_failed=1
          response="${result%$'\n'*}"
          http_status="${result##*$'\n'}"
          REQUEST_STARTED_AT="$request_started_at" HTTP_STATUS="$http_status" REQUEST_FAILED="$request_failed" RESPONSE="$response" python3 - <<'PY'
          import json, math, os, re, time, urllib.request, urllib.error
          def number(obj, key):
              value = obj.get(key)
              try:
                  return value if type(value) in (int, float) and math.isfinite(value) and value >= 0 else None
              except OverflowError:
                  return None
          def boolean(obj, key):
              value = obj.get(key)
              return value if type(value) is bool else None
          def choice(obj, key, allowed):
              value = obj.get(key)
              return value if type(value) is str and value in allowed else 'unknown'
          def http_status(value):
              return value if type(value) is int and 100 <= value <= 599 else None
          class ValidationFailure(Exception):
              def __init__(self, stage, reason):
                  self.stage, self.reason = stage, reason
          def require(condition, stage, reason):
              if not condition:
                  raise ValidationFailure(stage, reason)
          observed_at = time.time()
          try:
              request_started_at = float(os.environ.get('REQUEST_STARTED_AT', ''))
              request_started_at = number({'value': request_started_at}, 'value')
          except ValueError:
              request_started_at = None
          parse_reason = ''
          try:
              data = json.loads(os.environ['RESPONSE'])
              if not isinstance(data, dict):
                  data, parse_reason = {}, 'invalid_shape'
          except (ValueError, KeyError):
              data, parse_reason = {}, 'invalid_json'
          retention = data.get('retention')
          retention = retention if isinstance(retention, dict) else {}
          succeeded = number(retention, 'lastSucceededAt')
          failures = number(retention, 'consecutiveFailures')
          request_duration = observed_at - request_started_at if request_started_at is not None else None
          failed = False
          message = ''
          try:
              require(os.environ.get('REQUEST_FAILED') == '0', 'request', 'transport_failure')
              require(os.environ.get('HTTP_STATUS') == '200', 'request', 'http_status')
              require(not parse_reason, 'response_json', parse_reason)
              require(request_started_at is not None and request_started_at > 0,
                      'request_timing', 'invalid_timestamp')
              # curl is capped at 90 seconds; allow at most one second for local
              # process/timestamp overhead, never an unbounded stale-time extension.
              require(0 <= request_duration <= 91, 'request_timing', 'invalid_duration')
              require(isinstance(data.get('retention'), dict), 'mushroom_receipt', 'invalid_shape')
              require(succeeded is not None and succeeded > 0, 'mushroom_receipt', 'invalid_timestamp')
              # A receipt fresh when this request began must not age out while
              # the server finishes history/health/snapshot. The endpoint still
              # enforces its own strict 300-second bound at receipt validation.
              require(request_started_at - succeeded <= 300, 'mushroom_receipt', 'stale_receipt')
              require(succeeded - observed_at <= 60, 'mushroom_receipt', 'future_timestamp')
              require(failures is not None, 'mushroom_receipt', 'invalid_failure_count')
              require(failures == 0, 'mushroom_receipt', 'recorded_failure')
              print('retention', {**{key: number(retention, key) for key in
                    ('lastSucceededAt', 'lastDeleted', 'pending', 'consecutiveFailures', 'lastDurationMs')},
                    'lastBatchSaturated': boolean(retention, 'lastBatchSaturated')})
              # Classify/throttle cleanup notifications centrally.
              # Keep the reason fields, not the full response or private fleet/history rows.
              health = data.get('maintenanceHealth')
              health = health if isinstance(health, dict) else {}
              severity = health.get('severity', 'legacy')
              severity = severity if severity in ('healthy', 'degraded', 'critical', 'legacy') else 'unknown'
              workflow_sha = os.environ.get('GITHUB_SHA', '')
              diagnostic = {
                  'severity': severity, 'responseAtMs': number(data, 'now'),
                  'workflowSha': workflow_sha if re.fullmatch('[0-9a-f]{40}', workflow_sha) else None,
                  **{key: number(health, key) for key in
                     ('evaluatedAt', 'cleanupAge', 'pending', 'historyPending', 'historyConsecutiveFailures',
                      'historyBacklogSinceMs', 'githubLastSucceededAt', 'independentLastSucceededAt')},
                  **{key: boolean(health, key) for key in
                     ('schedulerDelayed', 'cleanupFailing', 'backlogPersistent',
                      'historyFailing', 'historyBacklogPersistent')},
              }
              print('maintenanceHealth', json.dumps(diagnostic, sort_keys=True))
              alerts = data.get('alerts')
              require(isinstance(alerts, dict), 'alerts', 'invalid_shape')
              silent = alerts.get('uploadSilentAgents')
              require(isinstance(silent, list) and all(isinstance(agent, str) for agent in silent),
                      'alerts', 'invalid_shape')
              if 'uploadPendingUnknownAgents' in alerts:
                  unknown = alerts['uploadPendingUnknownAgents']
                  gaps = alerts.get('uploadDataGapAgents')
                  require(isinstance(unknown, list) and all(isinstance(agent, str) for agent in unknown)
                          and isinstance(gaps, list) and all(isinstance(agent, str) for agent in gaps),
                          'alerts', 'invalid_shape')
                  unknown = [agent for agent in gaps if agent in unknown]
              else:
                  # Older sites only report a data gap; it is not proof of a stall.
                  unknown, silent = silent, []
              messages = []
              if silent:
                  messages.append('待送資料持續兩小時未上傳：' + ', '.join(silent))
              if unknown:
                  messages.append('兩小時無新資料、待送狀態未知：' + ', '.join(unknown))
              if messages:
                  message = '【蘑菇機隊上傳檢查】' + '；'.join(messages)
          except Exception as error:
              failed = True
              failure = data.get('maintenanceFailure')
              failure = failure if isinstance(failure, dict) else {}
              status = os.environ.get('HTTP_STATUS', '')
              diagnostic = {
                  'httpStatus': http_status(int(status)) if re.fullmatch('[0-9]{3}', status) else None,
                  'requestFailed': os.environ.get('REQUEST_FAILED') != '0',
                  'clientStage': error.stage if isinstance(error, ValidationFailure) else 'parser',
                  'clientReason': error.reason if isinstance(error, ValidationFailure) else 'exception',
                  'requestStartedAt': request_started_at, 'observedAt': observed_at,
                  'requestDurationSeconds': number({'value': request_duration}, 'value'),
                  'receiptLastSucceededAt': succeeded, 'receiptConsecutiveFailures': failures,
                  'stage': choice(failure, 'stage', ('schema', 'mushroom_run', 'mushroom_receipt',
                      'history_run', 'history_receipt', 'source_receipt', 'health', 'snapshot')),
                  'reason': choice(failure, 'reason', ('exception', 'invalid_timestamp', 'future_timestamp',
                      'stale_receipt', 'incomplete_run', 'recorded_failure', 'table_failure')),
                  'source': choice(failure, 'source', ('schedule', 'cloudflare-cron', 'workflow_dispatch')),
                  **{key: number(failure, key) for key in ('attemptedAtMs', 'observedAtMs',
                      'mushroomLastRunAt', 'mushroomLastSucceededAt', 'mushroomConsecutiveFailures',
                      'historyLastRunAtMs', 'historyLastSucceededAtMs', 'historyConsecutiveFailures')},
                  **{key: boolean(failure, key) for key in ('sourceReceiptRecorded', 'historyBusy')},
              }
              print('maintenanceFailure', json.dumps(diagnostic, sort_keys=True))
              message = '【蘑菇清理連線異常】GitHub 無法取得清理成功回報；請檢查站台或憑證，不能假設備援正常。'
          if os.environ.get('SCHEDULE') == '13 * * * *' and message:
              webhook = os.environ.get('DISCORD_WEBHOOK', '')
              if not webhook:
                  raise SystemExit('Fleet alert webhook missing')
              request = urllib.request.Request(webhook,
                  data=json.dumps({'content': message, 'allowed_mentions': {'parse': []}}).encode(),
                  headers={'Content-Type': 'application/json'}, method='POST')
              delivery_status = None
              try:
                  with urllib.request.urlopen(request, timeout=20) as reply:
                      delivery_status = http_status(reply.status)
                      if reply.status not in (200, 204):
                          raise RuntimeError('delivery rejected')
              except Exception as error:
                  if isinstance(error, urllib.error.HTTPError):
                      delivery_status = http_status(error.code)
                  print('fleetAlertFailure', json.dumps({'httpStatus': delivery_status,
                      'stage': 'http' if delivery_status is not None else 'request'}, sort_keys=True))
                  print('::warning::Fleet alert delivery failed; cleanup result is separate')
          raise SystemExit(1 if failed else 0)
          PY
